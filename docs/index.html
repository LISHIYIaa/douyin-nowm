<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>去水印 · 原视频/图片下载（抖音 / 小红书）</title>
<style>
  :root {
    --bg: #0f0f13;
    --card: #1a1a22;
    --card-hover: #22222e;
    --border: #2e2e3a;
    --text: #e8e8ef;
    --text-dim: #8888a0;
    --accent: #ff2c55;
    --accent-hover: #ff4470;
    --accent-dim: rgba(255,44,85,.12);
    --xhs: #ff2442;
    --xhs-hover: #ff4466;
    --xhs-dim: rgba(255,36,66,.12);
    --green: #00d68f;
    --radius: 16px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container { width: 100%; max-width: 580px; }

  /* Header */
  .header { text-align: center; margin-bottom: 28px; position: relative; }
  .logo {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 22px; font-weight: 700; margin-bottom: 6px;
  }
  .logo-icon {
    width: 38px; height: 38px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), #ff6b8a);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .subtitle { color: var(--text-dim); font-size: 13px; }
  .btn-settings {
    position: absolute; top: 0; right: 0;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 12px;
    color: var(--text-dim); font-size: 14px; cursor: pointer;
    transition: all .2s;
  }
  .btn-settings:hover { border-color: var(--text-dim); color: var(--text); }

  /* Settings panel */
  .settings-panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
    display: none;
  }
  .settings-panel.show { display: block; }
  .settings-panel label {
    display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 8px;
  }
  .settings-panel input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
  }
  .settings-panel input:focus { border-color: var(--accent); }
  .settings-panel .settings-hint {
    font-size: 12px; color: var(--text-dim); margin-top: 8px; line-height: 1.5;
  }
  .settings-panel .settings-actions {
    display: flex; gap: 8px; margin-top: 12px;
  }
  .settings-panel .btn-save {
    background: var(--accent); color: #fff; border: none;
    border-radius: 10px; padding: 10px 20px; font-size: 14px;
    font-weight: 600; cursor: pointer; transition: background .2s;
  }
  .settings-panel .btn-save:hover { background: var(--accent-hover); }
  .settings-panel .btn-close {
    background: var(--card-hover); color: var(--text-dim); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 20px; font-size: 14px;
    cursor: pointer; transition: all .2s;
  }
  .settings-panel .btn-close:hover { color: var(--text); }

  /* Platform tabs */
  .platform-tabs {
    display: flex; gap: 8px; margin-bottom: 14px; justify-content: center;
  }
  .platform-tab {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 16px; border-radius: 10px;
    background: var(--card); border: 1px solid var(--border);
    font-size: 13px; color: var(--text-dim); cursor: pointer;
    transition: all .2s;
  }
  .platform-tab.active {
    background: var(--accent-dim); border-color: var(--accent); color: var(--accent);
  }
  .platform-tab.active.xhs {
    background: var(--xhs-dim); border-color: var(--xhs); color: var(--xhs);
  }
  .platform-tab:hover { border-color: var(--text-dim); }

  /* Input Card */
  .input-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
  }
  .input-row { display: flex; gap: 12px; }
  .input-wrap { flex: 1; position: relative; }
  .input-wrap input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px 14px 42px;
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: border-color .2s;
  }
  .input-wrap input:focus { border-color: var(--accent); }
  .input-wrap input:focus.xhs { border-color: var(--xhs); }
  .input-wrap input::placeholder { color: var(--text-dim); }
  .input-icon {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    font-size: 18px; opacity: .5;
  }
  .btn-parse {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 14px 24px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background .2s, transform .1s;
  }
  .btn-parse.xhs { background: var(--xhs); }
  .btn-parse:hover { background: var(--accent-hover); }
  .btn-parse.xhs:hover { background: var(--xhs-hover); }
  .btn-parse:active { transform: scale(.96); }
  .btn-parse:disabled { opacity: .5; cursor: not-allowed; }

  /* Quality toggle (douyin only) */
  .quality-row {
    display: flex; align-items: center; gap: 8px;
    margin-top: 14px; font-size: 13px; color: var(--text-dim);
    transition: opacity .2s;
  }
  .quality-row.disabled { opacity: .3; pointer-events: none; }
  .quality-toggle {
    display: inline-flex; background: var(--bg); border-radius: 10px; padding: 3px;
    border: 1px solid var(--border);
  }
  .quality-toggle button {
    background: none; border: none; color: var(--text-dim);
    padding: 6px 14px; border-radius: 8px; font-size: 13px; cursor: pointer;
    transition: all .2s;
  }
  .quality-toggle button.active {
    background: var(--accent-dim); color: var(--accent);
  }

  /* Loading */
  .loading {
    text-align: center; padding: 40px 0; color: var(--text-dim);
  }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Error */
  .error {
    background: rgba(255,44,85,.1);
    border: 1px solid rgba(255,44,85,.3);
    border-radius: 12px;
    padding: 16px;
    color: #ff6b8a;
    font-size: 14px;
    margin-top: 16px;
  }

  /* Result Card */
  .result-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-top: 20px;
    animation: slideUp .3s ease;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .result-cover {
    width: 100%; max-height: 220px; object-fit: cover;
    display: block;
  }
  .result-body { padding: 20px; }
  .result-author {
    display: flex; align-items: center; gap: 8px;
    font-size: 14px; margin-bottom: 6px; font-weight: 600;
  }
  .result-author.douyin { color: var(--accent); }
  .result-author.xhs { color: var(--xhs); }
  .platform-badge {
    font-size: 10px; padding: 2px 8px; border-radius: 6px;
    background: var(--accent-dim); color: var(--accent);
  }
  .platform-badge.xhs { background: var(--xhs-dim); color: var(--xhs); }
  .result-desc {
    font-size: 14px; color: var(--text); margin-bottom: 16px;
    line-height: 1.5;
  }

  /* Stats grid */
  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    margin-bottom: 20px;
  }
  .stat {
    background: var(--bg); border-radius: 10px; padding: 12px 8px;
    text-align: center;
  }
  .stat-val { font-size: 16px; font-weight: 700; }
  .stat-label { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

  /* Download bar */
  .download-bar {
    display: flex; gap: 12px; align-items: center;
    background: var(--bg); border-radius: 12px; padding: 14px 16px;
  }
  .download-info { flex: 1; min-width: 0; }
  .download-quality { font-size: 13px; font-weight: 600; color: var(--green); }
  .download-size { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .btn-download {
    background: var(--green);
    color: #002618;
    border: none;
    border-radius: 10px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: opacity .2s, transform .1s;
  }
  .btn-download:hover { opacity: .85; }
  .btn-download:active { transform: scale(.95); }

  /* Copy link */
  .copy-row {
    display: flex; gap: 8px; margin-top: 12px;
  }
  .copy-input {
    flex: 1; background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; color: var(--text-dim);
    font-size: 12px; outline: none;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .btn-copy {
    background: var(--card-hover); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 16px; color: var(--text);
    font-size: 13px; cursor: pointer; white-space: nowrap;
    transition: background .2s;
  }
  .btn-copy:hover { background: var(--border); }
  .btn-copy.copied { background: var(--green); color: #002618; border-color: var(--green); }

  /* Image gallery */
  .image-gallery {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-top: 16px;
  }
  .img-card {
    position: relative;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .img-thumb {
    width: 100%;
    aspect-ratio: 3/4;
    object-fit: cover;
    display: block;
    cursor: pointer;
    transition: opacity .2s;
  }
  .img-thumb:hover { opacity: .85; }
  .img-info {
    display: flex;
    justify-content: space-between;
    padding: 8px 10px;
    font-size: 11px;
    color: var(--text-dim);
  }
  .btn-img-download {
    position: absolute;
    top: 8px; right: 8px;
    width: 32px; height: 32px;
    background: rgba(0,0,0,.6);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    opacity: 0;
    transition: opacity .2s;
  }
  .img-card:hover .btn-img-download { opacity: 1; }

  /* Footer */
  .footer {
    text-align: center; color: var(--text-dim); font-size: 12px;
    margin-top: 24px;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">
      <div class="logo-icon">🎬</div>
      <span>去水印下载</span>
    </div>
    <p class="subtitle">抖音 / 小红书 · 粘贴链接或分享文本，一键获取无水印原视频/原图</p>
    <button class="btn-settings" onclick="toggleSettings()">⚙️ 设置</button>
  </div>

  <div class="settings-panel" id="settings-panel">
    <label>API 服务器地址（腾讯云 SCF 函数 URL）</label>
    <input type="text" id="scf-url-input" placeholder="https://xxx.ap-guangzhou.tencentscf.com">
    <div class="settings-hint">
      在腾讯云 SCF 控制台找到你的函数 URL（形如 https://13001...tencentscf.com）<br>
      填入后点击保存，页面将自动使用该地址进行解析和下载。
    </div>
    <div class="settings-actions">
      <button class="btn-save" onclick="saveScfUrl()">保存</button>
      <button class="btn-close" onclick="toggleSettings()">关闭</button>
    </div>
  </div>

  <div class="platform-tabs">
    <div class="platform-tab active" id="tab-douyin" onclick="setPlatform('douyin')">🎵 抖音</div>
    <div class="platform-tab" id="tab-xhs" onclick="setPlatform('xhs')">📕 小红书</div>
  </div>

  <div class="input-card">
    <div class="input-row">
      <div class="input-wrap">
        <span class="input-icon">🔗</span>
        <input type="text" id="url-input" placeholder="粘贴分享链接或分享文本..." autofocus>
      </div>
      <button class="btn-parse" id="btn-parse" onclick="parseLink()">解析</button>
    </div>
    <div class="quality-row" id="quality-row">
      <span>清晰度：</span>
      <div class="quality-toggle">
        <button class="active" data-q="default" onclick="setQuality('default')">原画</button>
        <button data-q="720p" onclick="setQuality('720p')">720P</button>
      </div>
    </div>
    <div id="error-msg"></div>
  </div>

  <div id="result-area"></div>

  <div class="footer">
    本工具仅供学习交流使用 · 请尊重创作者版权
  </div>
</div>

<script>
// ===== API 配置 =====
// 从 localStorage 读取 SCF 函数 URL，如果没有则使用默认值
let API_BASE = localStorage.getItem('scf_url') || '';

function getApiBase() {
  // 如果 API_BASE 为空，说明是同源部署（本地 Python 服务器），使用相对路径
  // 如果有值，说明是跨域部署（GitHub Pages + SCF），使用完整 URL
  return API_BASE || '';
}

function toggleSettings() {
  const panel = document.getElementById('settings-panel');
  panel.classList.toggle('show');
  if (panel.classList.contains('show')) {
    document.getElementById('scf-url-input').value = API_BASE;
    document.getElementById('scf-url-input').focus();
  }
}

function saveScfUrl() {
  const val = document.getElementById('scf-url-input').value.trim();
  if (val && !val.startsWith('http')) {
    showError('请输入完整的 URL（以 https:// 开头）');
    return;
  }
  API_BASE = val.replace(/\/+$/, ''); // 去掉末尾斜杠
  localStorage.setItem('scf_url', API_BASE);
  document.getElementById('settings-panel').classList.remove('show');
  // 清空之前的结果
  document.getElementById('result-area').innerHTML = '';
  clearError();
}

let platform = 'douyin';
let quality = 'default';
const urlInput = document.getElementById('url-input');
const btnParse = document.getElementById('btn-parse');
const resultArea = document.getElementById('result-area');
const errorEl = document.getElementById('error-msg');
const qualityRow = document.getElementById('quality-row');

urlInput.addEventListener('input', () => {
  const v = urlInput.value.trim().toLowerCase();
  // 自动检测平台
  if (v.includes('xiaohongshu') || v.includes('xhslink') || v.includes('xhs.cn')) {
    if (platform !== 'xhs') setPlatform('xhs');
  } else if (v.includes('douyin') || v.includes('iesdouyin') || v.includes('v.douyin')) {
    if (platform !== 'douyin') setPlatform('douyin');
  }
});
urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') parseLink(); });

function setPlatform(p) {
  platform = p;
  document.querySelectorAll('.platform-tab').forEach(t => t.classList.remove('active', 'xhs'));
  const tab = document.getElementById('tab-' + p);
  tab.classList.add('active');
  if (p === 'xhs') tab.classList.add('xhs');

  if (p === 'xhs') {
    urlInput.placeholder = '粘贴小红书分享链接或分享文本...';
    btnParse.classList.add('xhs');
    urlInput.classList.add('xhs');
    qualityRow.classList.add('disabled');
  } else {
    urlInput.placeholder = '粘贴抖音分享链接或分享文本...';
    btnParse.classList.remove('xhs');
    urlInput.classList.remove('xhs');
    qualityRow.classList.remove('disabled');
  }
  urlInput.focus();
}

function setQuality(q) {
  quality = q;
  document.querySelectorAll('.quality-toggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.q === q);
  });
}

function showError(msg) {
  errorEl.innerHTML = '<div class="error">\u26a0\ufe0f ' + msg + '</div>';
}
function clearError() { errorEl.innerHTML = ''; }

function formatNum(n) {
  if (!n) return '0';
  if (n >= 10000) return (n / 10000).toFixed(1) + '万';
  return n.toLocaleString();
}

async function parseLink() {
  const url = urlInput.value.trim();
  if (!url) { showError('请输入视频链接'); return; }

  // 检查 API_BASE 是否已配置
  if (!API_BASE) {
    showError('请先点击右上角「设置」填入你的 SCF 函数 URL');
    toggleSettings();
    return;
  }

  clearError();
  resultArea.innerHTML = '';
  btnParse.disabled = true;
  btnParse.textContent = '解析中...';

  resultArea.innerHTML = `
    <div class="result-card"><div class="loading">
      <div class="spinner"></div>
      <p>正在解析视频信息...</p>
    </div></div>`;

  try {
    const resp = await fetch(getApiBase() + '/api/parse', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url, quality })
    });
    const data = await resp.json();

    if (!data.ok) throw new Error(data.error || '解析失败');

    const isXHS = data.platform === 'xhs';
    const pClass = isXHS ? 'xhs' : 'douyin';
    const pLabel = isXHS ? '小红书' : '抖音';
    const pIcon = isXHS ? '📕' : '🎵';
    const isImage = data.note_type === 'image';

    const badge = isXHS
      ? (isImage
        ? `<span style="color:var(--green)">● 原图高清</span>`
        : `<span style="color:var(--green)">● 原始高清</span>`)
      : (quality === 'default'
        ? `<span style="color:var(--green)">● 原始高清</span>`
        : `<span style="color:var(--text-dim)">● 720P 压缩</span>`);

    if (isImage) {
      // 图文笔记：显示图片画廊
      let imgCards = '';
      data.images.forEach((img, i) => {
        const imgFilename = (data.author + '_' + (data.pub_date || '') + '_' + (i+1) + '.jpg').replace(/[\\/:*?"<>|#]/g, '_');
        imgCards += `
          <div class="img-card">
            <img class="img-thumb" src="${img.url}" alt="图${i+1}" referrerpolicy="no-referrer" loading="lazy">
            <div class="img-info">
              <span class="img-dim">${img.width}x${img.height}</span>
              <span class="img-size">${img.file_size_human}</span>
            </div>
            <a class="btn-img-download" href="${getApiBase()}/api/download?url=${encodeURIComponent(img.url)}&platform=xhs&filename=${encodeURIComponent(imgFilename)}" download>⬇</a>
          </div>`;
      });

      const totalFilename = (data.author + '_' + (data.pub_date || '') + '_全部图片.zip').replace(/[\\/:*?"<>|#]/g, '_');
      const xsecToken = data.xsec_token || '';

      resultArea.innerHTML = `
        <div class="result-card">
          <div class="result-body">
            <div class="result-author ${pClass}">
              <span class="platform-badge ${isXHS ? 'xhs' : ''}">${pIcon} ${pLabel}</span>
              @${data.author}${data.pub_date ? ` · ${data.pub_date}` : ''}
            </div>
            <div class="result-desc">${data.desc || '无描述'}</div>
            <div class="stats">
              <div class="stat">
                <div class="stat-val">${data.resolution}</div>
                <div class="stat-label">首图尺寸</div>
              </div>
              <div class="stat">
                <div class="stat-val">${data.duration}</div>
                <div class="stat-label">图片数</div>
              </div>
              <div class="stat">
                <div class="stat-val">${formatNum(data.digg_count)}</div>
                <div class="stat-label">点赞</div>
              </div>
              <div class="stat">
                <div class="stat-val">${formatNum(data.collected_count || data.comment_count)}</div>
                <div class="stat-label">收藏</div>
              </div>
            </div>
            <div class="download-bar">
              <div class="download-info">
                <div class="download-quality">${badge}</div>
                <div class="download-size">共 ${data.images.length} 张 · ${data.file_size_human}</div>
              </div>
              <a class="btn-download" href="${getApiBase()}/api/download_zip?note_id=${data.video_id}&author=${encodeURIComponent(data.author)}&pub_date=${encodeURIComponent(data.pub_date||'')}&xsec_token=${encodeURIComponent(xsecToken)}" target="_blank">
                ⬇ 打包下载
              </a>
            </div>
            <div class="image-gallery">${imgCards}</div>
          </div>
        </div>`;
    } else {
      // 视频笔记
      const filename = (data.author + '_' + (data.pub_date || '') + '.mp4').replace(/[\\/:*?"<>|#]/g, '_');

      resultArea.innerHTML = `
        <div class="result-card">
          ${data.cover_url ? `<img class="result-cover" src="${data.cover_url}" alt="cover" referrerpolicy="no-referrer">` : ''}
          <div class="result-body">
            <div class="result-author ${pClass}">
              <span class="platform-badge ${isXHS ? 'xhs' : ''}">${pIcon} ${pLabel}</span>
              @${data.author}${data.pub_date ? ` · ${data.pub_date}` : ''}
            </div>
            <div class="result-desc">${data.desc || '无描述'}</div>
            <div class="stats">
              <div class="stat">
                <div class="stat-val">${data.resolution}</div>
                <div class="stat-label">分辨率</div>
              </div>
              <div class="stat">
                <div class="stat-val">${data.duration}</div>
                <div class="stat-label">时长</div>
              </div>
              <div class="stat">
                <div class="stat-val">${formatNum(data.digg_count)}</div>
                <div class="stat-label">点赞</div>
              </div>
              <div class="stat">
                <div class="stat-val">${formatNum(data.collected_count || data.comment_count)}</div>
                <div class="stat-label">${isXHS ? '收藏' : '评论'}</div>
              </div>
            </div>
            <div class="download-bar">
              <div class="download-info">
                <div class="download-quality">${badge}</div>
                <div class="download-size">${data.file_size_human} · ${data.content_type}</div>
              </div>
              <a class="btn-download" href="${getApiBase()}/api/download?url=${encodeURIComponent(data.download_url)}&platform=${data.platform}&filename=${encodeURIComponent(filename)}">
                ⬇ 下载
              </a>
            </div>
            <div class="copy-row">
              <input class="copy-input" id="dl-url" value="${data.download_url}" readonly>
              <button class="btn-copy" onclick="copyLink(this)">复制链接</button>
            </div>
          </div>
        </div>`;
    }
  } catch (err) {
    resultArea.innerHTML = '';
    showError(err.message);
  } finally {
    btnParse.disabled = false;
    btnParse.textContent = '解析';
  }
}

function copyLink(btn) {
  const input = document.getElementById('dl-url');
  navigator.clipboard.writeText(input.value).then(() => {
    btn.textContent = '已复制 ✓';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = '复制链接';
      btn.classList.remove('copied');
    }, 2000);
  });
}
</script>
</body>
</html>
